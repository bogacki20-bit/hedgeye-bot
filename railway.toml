[build]
builder = "NIXPACKS"

[deploy]
startCommand = "playwright install chromium && python -u main.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# ─────────────────────────── Sibling services ───────────────────────────
# This file configures the BOT service. The IBKR market-data gateway runs
# as a SEPARATE Railway service ("ibkr-gateway") with its own railway.toml
# under deploy/ibkr-gateway/. See deploy/ibkr-gateway/README.md for the
# step-by-step setup. Once that service is up, set PRICE_FEED=ibkr and
# IBKR_GATEWAY_URL=http://ibkr-gateway.railway.internal:5000 on the bot
# service. Until then, PRICE_FEED=yfinance (default) and IBKR code paths
# are dormant.

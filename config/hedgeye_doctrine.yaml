# ---------------------------------------------------------------------------
# F. quad_definitions — narrative + TRADE/TREND/TAIL doctrine (slide_1).
#    "Bullish Formation" = last price > all of TRADE, TREND, TAIL (buy dips).
#    "Bearish Formation" = inverse (short strength). TRADE <=3wk, TREND
#    >=3mo, TAIL <=3yr.
# ---------------------------------------------------------------------------
quad_definitions:
  "Quad 1": "Goldilocks: growth accelerating, inflation decelerating. Best: Equities, Credit, Commodities, FX. Worst: Fixed Income, USD."
  "Quad 2": "Reflation: growth accelerating, inflation accelerating. Best: Commodities, Equities, Credit, FX. Worst: Fixed Income, USD."
  "Quad 3": "Stagflation: growth decelerating, inflation accelerating. Best: Gold, Commodities, Fixed Income. Worst: Credit."
  "Quad 4": "Deflation: growth decelerating, inflation decelerating. Best: Fixed Income, Gold, USD. Worst: Commodities, Equities, Credit, FX."
formation_doctrine:
  bullish: "Last price above TRADE, TREND and TAIL (ascending) -> Bullish Formation: buy all dips."
  bearish: "Last price below all three -> Bearish Formation: short strength repeatedly."
  durations: { TRADE: "3 weeks or less", TREND: "3 months or more", TAIL: "3 years or less" }

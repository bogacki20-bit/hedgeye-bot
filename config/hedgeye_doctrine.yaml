# Hedgeye GIP-model doctrine — source of truth for Quad-aware positioning.
#
# Extracted via vision from the four Hedgeye doctrine slides:
#   slide_1  "The Quads Provide A Reliable Starting Point" (TRADE/TREND/TAIL)
#   slide_2  "Position Sizing" matrix
#   slide_3  "Quarterly Expected Values By GIP Model Quad Regime" (heatmap)
#   slide_4  "Highest/Lowest Expected Values By Quad Regime"
#
# Quad definitions (GIP = Growth, Inflation, Policy):
#   Quad 1  Goldilocks  — growth accelerating, inflation decelerating
#   Quad 2  Reflation   — growth accelerating, inflation accelerating
#   Quad 3  Stagflation — growth decelerating, inflation accelerating
#   Quad 4  Deflation   — growth decelerating, inflation decelerating
#
# Hedgeye runs a MULTI-TIMEFRAME model: track BOTH the quarterly Quad
# (strategic — universe + asset-class caps) and the monthly Quad
# (tactical — alert calibration, daily bias). tools/doctrine.py reads
# this file; tools/detect_quads.py keeps the active Quads in bot_state.

# ---------------------------------------------------------------------------
# A. quad_universe — favored longs / shorts per Quad, by asset class.
#    Sourced from slide_4 (Highest/Lowest Expected Values By Quad Regime).
#    Sector / style-factor names are mapped to their liquid ETF proxies
#    via `sector_etf` / `style_factor_etf` below.
# ---------------------------------------------------------------------------
quad_universe:
  "Quad 1":
    label: Goldilocks
    longs:
      equities:     [XLK, XLY, XLC, XLI, XLB, XLRE, SPHB, MTUM, QQQ, IWR]
      fixed_income: [BIZD, CWB, HYG, EMB, BKLN]
      commodities:  [DBC, USO, CPER]
      fx:           [FXE, FXB, FXA]          # pro-risk FX vs USD
      crypto:       [GBTC, ETHE]
    shorts:
      equities:     [XLU, XLP, XLV, SPLV, IWD, SDY]
      fixed_income: [TLT, IEF, MBB, TIP, SHY]
      fx:           [UUP]                    # short USD in Quad 1
  "Quad 2":
    label: Reflation
    longs:
      equities:     [XLK, XLI, XLF, XLE, XLY, SPHB, MTUM, QQQ, IWM]
      fixed_income: [CWB, BIZD, PFF, BKLN, HYG]
      commodities:  [DBC, USO, UNG, CPER]
      fx:           [FXE, FXA, FXC]
      crypto:       [GBTC, ETHE]
    shorts:
      equities:     [XLU, XLC, XLP, XLRE, XLV, SPLV, SDY, IWD]
      fixed_income: [TLT, IEF, MUB, MBB, LQD]
      fx:           [UUP]
  "Quad 3":
    label: Stagflation
    longs:
      equities:     [XLU, XLE, XLRE, XLK, XLP, XLV, MTUM, QUAL, SPLV]
      fixed_income: [MUB, EMB, TLT, TIP, IEF]
      commodities:  [GLD, DBC, USO, UNG]
      fx:           [UUP]                    # USD/gold bid in Quad 3
    shorts:
      equities:     [XLC, XLF, XLY, XLI, XLB, IWM, SDY, IWD]
      fixed_income: [BIZD, PFF, CWB, BKLN, HYG]
  "Quad 4":
    label: Deflation
    longs:
      equities:     [XLP, XLV, XLU, SPLV, SDY, QUAL]
      fixed_income: [TLT, IEF, LQD, MUB, MBB]
      commodities:  [GLD]
      fx:           [UUP]                    # long USD in Quad 4
    shorts:
      equities:     [XLE, XLK, XLF, XLI, XLY, SPHB, MTUM, QQQ]
      fixed_income: [PFF, EMLC, BIZD, BKLN, TIP]
      commodities:  [DBC, USO, UNG, CPER]
      crypto:       [GBTC, ETHE]

# ---------------------------------------------------------------------------
# B. position_sizing_caps — Hedgeye "Position Sizing" matrix (slide_2).
#    Per-position maximum as a % of account value, by asset class.
#    Long-Short equity allocation: max long 6% / short 3% (per slide_2
#    "Maximum" row); mid 4%/2%; min 2%/1%.
# ---------------------------------------------------------------------------
position_sizing_caps:
  foreign_currency: { max_pct: 12 }
  fixed_income:     { max_pct: 10 }
  equities:         { max_long_pct: 6, max_short_pct: 3 }
  commodities:      { max_pct: 4 }
  options:          { max_pct: 2 }            # slide_2 shows 1-2%; cap at 2
  crypto:           { max_pct: 4 }            # FIXME: not on slide_2; treated
                                              # as commodity-equivalent risk
long_short_ratio:
  max_long_short_ratio: "6:3"
  equity_long:  { max_pct: 6, mid_pct: 4, min_pct: 2 }
  equity_short: { max_pct: 3, mid_pct: 2, min_pct: 1 }

# ---------------------------------------------------------------------------
# C. expected_returns — per Quad x ticker historical quarterly avg return
#    from slide_3 ("Quarterly Expected Values By GIP Model Quad Regime",
#    "EV by Quadrant" columns 1-4).
#
#    The slide_3 heatmap is ~70 rows x dozens of columns at a resolution
#    where exact per-cell percentages are NOT reliably legible from the
#    attached PNG. The directionally-confident, high-signal rows are
#    encoded below. For the FULL precise matrix, re-extract from the
#    300-DPI Macro Show PDF per the master-prompt fallback:
#      cd data/snapshots/hedgeye/<latest>/macro_show/
#      pdftoppm -f 11 -l 11 -r 300 HE_TMS_*_*.pdf slide_11 -png
#    then read slide_11-11.png with vision and fill the FIXME rows.
#
#    Values are average quarterly % return when that Quad is active.
expected_returns:

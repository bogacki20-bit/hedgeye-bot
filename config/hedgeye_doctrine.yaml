# ---------------------------------------------------------------------------
# D. ticker_to_asset_class — every universe ticker -> cap category.
#    Categories match position_sizing_caps keys:
#      equities | fixed_income | commodities | foreign_currency
#      | options | crypto
# ---------------------------------------------------------------------------
ticker_to_asset_class:
  # --- equities (broad, sector, style-factor ETFs) ---
  SPY: equities
  QQQ: equities
  IWM: equities
  IWR: equities
  IWD: equities
  IWF: equities
  RSP: equities
  OEF: equities
  XLK: equities
  XLY: equities
  XLC: equities
  XLI: equities
  XLB: equities
  XLRE: equities
  XLU: equities
  XLP: equities
  XLV: equities
  XLF: equities
  XLE: equities
  SPHB: equities
  SPLV: equities
  MTUM: equities
  QUAL: equities
  SDY: equities
  # --- inverse single-stock (Direxion Daily 1X Bear) — equities, NOT
  #     financials. These are short-MSFT / short-META expressions and
  #     show up as "MSFT bear" / "META bear" in Fidelity history. ---
  MSFD: equities
  METD: equities
  # --- fixed income ---
  AGG: fixed_income
  TLT: fixed_income
  IEF: fixed_income
  IEI: fixed_income
  TLH: fixed_income
  SHY: fixed_income
  TIP: fixed_income
  STIP: fixed_income
  LQD: fixed_income
  HYG: fixed_income
  MBB: fixed_income
  MUB: fixed_income
  BAB: fixed_income
  BKLN: fixed_income
  BIZD: fixed_income
  CWB: fixed_income
  PFF: fixed_income
  EMB: fixed_income
  EMLC: fixed_income
  # --- commodities ---
  DBC: commodities
  USO: commodities
  UNG: commodities
  GLD: commodities
  SLV: commodities
  CPER: commodities
  # --- foreign currency ---
  UUP: foreign_currency
  FXE: foreign_currency
  FXB: foreign_currency
  FXA: foreign_currency
  FXC: foreign_currency
  FXY: foreign_currency
  # --- crypto ---
  GBTC: crypto
  ETHE: crypto

# ---------------------------------------------------------------------------
# D2. Inverse single-stock ETF metadata. These resolve to `equities`
#     above (asset-class cap). This block records the directional intent:
#     holding the ETF long == a SHORT in `underlying`. Sector is the
#     underlying's GICS bucket so they are NOT mis-bucketed as financials.
# ---------------------------------------------------------------------------
inverse_single_stock:
  MSFD:
    kind: inverse_single_stock_short
    underlying: MSFT
    sector: Tech/Comms
    description: Direxion Daily MSFT Bear 1X
  METD:
    kind: inverse_single_stock_short
    underlying: META
    sector: Tech/Comms
    description: Direxion Daily META Bear 1X


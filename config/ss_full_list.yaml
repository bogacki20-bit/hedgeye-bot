# Manual override for the full Signal Strength membership list.
#
# Why this file exists: the SS email's body text only contains the
# Added/Removed deltas — the full ~85-stock SS list is a PNG image
# embedded in the email (verified 2026-05-29 — body is only ~1KB of
# plain text). The parser correctly captures every ticker that's
# textually present (the deltas) but cannot see the image content
# without OCR.
#
# This file is the AUTHORITATIVE `signal_strength` roster in
# tools.active_slice — when non-empty it REPLACES the drift-prone
# Add/Remove delta reconstruction (the SS full list is image-only in the
# email, so accumulated deltas drift: the bot held 118 names vs the real
# 78 on 2026-06-24). Operator pastes Keith's current full SS list here and
# the bot polls EXACTLY these names. Empty list -> fall back to deltas.
#
# Format: one ticker per line under `tickers:`. Whitespace and case
# are normalized on load. Empty list is fine — the bucket then falls
# back to the accumulated-deltas-only membership.
#
# Sides (operator clarification 2026-05-29): SS has Best Idea Longs
# AND Best Idea Shorts sections. Both go under `tickers:` for polling
# membership; the bot treats them as implicit-long by default. If you
# need explicit short-side handling for SS tickers, add them to
# operator_watchlist.yaml with a side annotation (future enhancement).

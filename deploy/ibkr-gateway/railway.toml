# deploy/ibkr-gateway/railway.toml
# Railway service config for the IBKR market-data gateway. This is a SECOND
# service deployed alongside the bot; the bot talks to it on the Railway
# private network. See README.md in this directory for setup steps.

[build]
# Build from the public voyz/ibeam image — no local Dockerfile.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Internal port — ibeam exposes the Client Portal API on 5000. Do NOT
# create a public domain for this service; the bot reaches it via
# ibkr-gateway.railway.internal:5000.
healthcheckPath = "/v1/api/iserver/auth/status"
# ibeam first boot legitimately takes ~60-90s: container start → IB Gateway
# JVM up → headless login → TOTP code-gen → IBKR session handshake →
# /v1/api/iserver/auth/status flips to authenticated:true. The previous 30s
# (and Railway's ~53s default) killed the container before auth completed.
# 300s = 5 min headroom for first boot + TOTP retries + slow handshakes.
healthcheckTimeout = 300

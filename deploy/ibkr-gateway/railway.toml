# deploy/ibkr-gateway/railway.toml
# Railway service config for the IBKR market-data gateway. Second service
# alongside the bot; the bot talks to it on the Railway private network at
# http://ibkr-gateway.railway.internal:5000. See README.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# /v1/api/iserver/auth/status returns 200 immediately at startup with
# authenticated:false (the Flask app comes up in seconds; the Selenium
# login runs in a background thread). So unlike ibeam (15 min healthcheck
# timeout to absorb IB Gateway JVM cold-boot), 60s is plenty here.
healthcheckPath = "/v1/api/iserver/auth/status"
healthcheckTimeout = 60
